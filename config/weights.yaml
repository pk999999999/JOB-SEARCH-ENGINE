# Scoring Weights Configuration
# All weights used in the ranking pipeline are defined here.
# Modify these to tune ranking behavior without changing code.

# Base score component weights (must sum to 1.0)
base_score:
  career_match: 0.30
  skill_match: 0.25
  experience_fit: 0.15
  location_fit: 0.10
  education_fit: 0.05
  rule_adjustments: 0.15

# Skill match sub-weights (must sum to 1.0)
skill_match:
  lexical_weight: 0.25
  bm25_weight: 0.35
  embedding_weight: 0.40

# Experience fit parameters
experience:
  ideal_min: 5
  ideal_max: 9
  sigma: 3.0  # Gaussian decay width

# Behavioral modifier range
behavioral:
  min_multiplier: 0.55
  max_multiplier: 1.15
  # Sub-weights for behavioral signals
  weights:
    recency: 0.20
    recruiter_response_rate: 0.20
    response_time: 0.15
    interview_completion: 0.15
    offer_acceptance: 0.10
    verified_email: 0.05
    verified_phone: 0.05
    linkedin_connected: 0.10

# Coherence scoring
coherence:
  min_factor: 0.70
  max_factor: 1.10

# Location tier scores
location:
  preferred: 1.0
  good: 0.8
  acceptable_country: 0.5
  outside_country: 0.2

# Education scoring
education:
  degree_scores:
    phd: 1.0
    masters: 0.8
    bachelors: 0.6
    other: 0.3
  field_relevance:
    exact_match: 1.0
    related: 0.7
    unrelated: 0.3

# Honeypot detection thresholds
honeypot:
  strong_threshold: 2          # Exclude if >= 2 strong signals
  strong_plus_medium: [1, 2]   # Exclude if >= 1 strong AND >= 2 medium

# Output
output:
  top_k: 100
